<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Error ${statusCode}</title>
	<style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f0f10;
            font-family: ui-monospace, 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .error-code {
            font-size: clamp(72px, 18vw, 140px);
            font-weight: 500;
            line-height: 1;
            letter-spacing: -4px;
            color: transparent;
            background: linear-gradient(135deg, #3b6d11 0%, #639922 50%, #97c459 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        hr {
            width: 40px;
            border: none;
            border-top: 1px solid #55555f;
        }

        .badge {
            font-size: clamp(9px, 2.5vw, 11px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c05a5a;
            background: rgba(192, 90, 90, 0.1);
            border: 1px solid rgba(192, 90, 90, 0.3);
            padding: 4px 14px;
            border-radius: 999px;
        }

        .description {
            font-size: clamp(12px, 3vw, 14px);
            font-style: italic;
            color: #55555f;
            max-width: 36ch;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 0.5rem;
            padding: 10px 22px;
            border-radius: 8px;
            border: 1px solid #2a2a38;
            background: #18181f;
            color: #8888aa;
            font-size: clamp(12px, 3vw, 14px);
            font-family: inherit;
            text-decoration: none;
            transition: border-color .15s, color .15s;
        }
        .btn:hover { border-color: #444455; color: #c8c8e0; }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-top: 1px solid #1a1a22;
        }

        .brand {
            font-size: clamp(10px, 2.5vw, 12px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #55555f;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(10px, 2.5vw, 12px);
            color: #55555f;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c05a5a;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }
	</style>
</head>
<body>
	<main>
		<p class="error-code">${statusCode}</p>
		<hr>
		<span class="badge">Error ${statusCode} · ${statusMessage}</span>
		<p class="description">${statusDescription}.</p>
		<a href="/" class="btn">&#8592; Go back</a>
	</main>
	<footer>
		<span class="brand">JHTTP (${serverVersion})</span>
		<span class="status">
				<span class="dot"></span>
				HTTP ${statusCode}
			</span>
	</footer>
</body>
</html>
